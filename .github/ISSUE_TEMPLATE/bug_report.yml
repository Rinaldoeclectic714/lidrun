name: Bug report
description: Something isn't working right in LidRun
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: LidRun version
      description: Menu bar → About (e.g. 1.1.40)
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version + Mac
      description: e.g. macOS 14.5 · MacBook Pro M3
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
